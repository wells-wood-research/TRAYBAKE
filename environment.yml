name: traybake
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  - pytest
  - tqdm
  - pytorch::pytorch=2.1.0
  - pytorch::torchvision=0.16.0
  - pytorch::cpuonly
  - torchmetrics=1.2
  - pytorch-lightning=2.1.0
  - pandas
  - pyyaml
  - numpy<2
  - scipy
  - rdkit=2022.03.3
  - ambertools
  - pip:
      - torch_geometric==2.4.0
